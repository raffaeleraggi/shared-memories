services:
  postgres:
    image: postgres:16
    container_name: shared-memories-postgres
    environment:
      POSTGRES_DB: shared_memories
      POSTGRES_USER: shared_user
      POSTGRES_PASSWORD: shared_password
    ports:
      - "5432:5432"
    volumes:
      - shared_memories_pgdata:/var/lib/postgresql/data

volumes:
  shared_memories_pgdata: